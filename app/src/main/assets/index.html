    show('Preparing…');
    const units=[];let n=0;
    for(const x of files){
      if(x.kind==='txt')for(const c of chunkText(x.text))units.push({kind:'txt',text:'From '+x.name+':\n'+c,name:x.name});
      else units.push({kind:'img',b:await shrink(x.f),name:'Photo '+(++n)})}
    const {done,left,used}=await runAll(units,ps,errs,s=>show(s));
    done.sort((a,b)=>a.i-b.i);
    const all=done.flatMap(d=>d.q),np=units.filter(u=>u.kind==='img').length,names=[...new Set(left.map(u=>u.name))];
    const note=left.length?'Not read: '+names.slice(0,8).join(', ')+(names.length>8?' …':'')+'. Every engine failed or reached its limit:\n'+[...new Set(errs)].join('\n'):'';
    if(!all.length)return show(note||'No answers found.');
    showItems(all,'via '+[...used].join(', ')+' · '+np+' photo'+(np===1?'':'s')+(units.length>np?' + document text':''),note,units);
  }catch(e){show('Could not read the files.')}
  finally{$('#go').disabled=false}
};
$('#cp').onclick=()=>{const b=$('#cp');let ok=false;
  try{if(window.Android&&window.Android.copy){window.Android.copy(lastText);ok=true}}catch(e){}
  if(!ok){try{const t=document.createElement('textarea');t.value=lastText;t.style.cssText='position:fixed;opacity:0';document.body.append(t);t.select();ok=document.execCommand('copy');t.remove()}catch(e){}}
  if(!ok&&navigator.clipboard)navigator.clipboard.writeText(lastText).catch(()=>{});
  b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)};
</script></body></html>
